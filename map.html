<body class="command-map-page">
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark"><svg viewBox="0 0 24 18"><path d="M1 1h22v16H1zM1 1l22 16M23 1 1 17" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span>兵牌编辑器</a><nav class="workspace-nav" aria-label="工作区"><a href="index.html">编制图</a><a href="map.html" aria-current="page">指挥地图</a></nav><div class="topbar-actions"><button id="map-undo" class="button hud-btn" disabled>撤销移动</button><button id="map-export" class="button hud-btn">保存地图</button></div></header>
<main class="map-shell">
<section class="map-workspace" aria-label="指挥地图工作区">
  <header class="map-heading"><div><p class="map-eyebrow">1939 年 9 月 1 日 · 德波双方</p><h1>波兰战役</h1><p class="map-note" id="map-dataset-note">总部驻地核查 · 城镇精度</p></div><div class="map-legend"><span><i class="german-key"></i>德军</span><span><i class="polish-key"></i>波军</span><span id="map-precision-legend" class="estimate-tag">推定部署</span></div></header>
  <div class="map-toolbar"><label class="sr-only" for="map-deployment-mode">部署资料</label><select id="map-deployment-mode"><option value="history">历史总部</option><option value="example">基层编制示例</option></select><label class="sr-only" for="map-basemap">底图</label><select id="map-basemap"><option value="roads">道路地图</option><option value="terrain">地形地图</option></select><label class="sr-only" for="map-side">显示阵营</label><select id="map-side"><option value="both">双方部队</option><option value="german">德军</option><option value="polish">波军</option></select><button id="map-expand" class="button hud-btn">展开一层</button><button id="map-collapse" class="button hud-btn">叠起一层</button><label class="map-check"><input type="checkbox" id="map-links" checked>指挥连线</label><label class="map-check"><input type="checkbox" id="map-auto-detail" checked>随缩放展开</label><label class="map-check"><input type="checkbox" id="map-edit-deployment">调整部署</label><button id="map-overview" class="button hud-btn">战役全图</button></div>
  <div class="map-board" id="map-board"><div id="map-tiles" class="map-tiles" aria-hidden="true"></div><button id="map-tile-status" class="map-tile-status" type="button" hidden></button><div id="map-attribution" class="map-attribution"></div><svg id="map-svg" role="group" tabindex="0" aria-label="可缩放和拖动的波兰战役指挥地图"><g id="map-world"><g id="map-geography"></g><g id="map-detail-grid"></g><g id="map-connections"></g><g id="map-anchors"></g><g id="map-markers"></g></g></svg><div class="map-focus" id="map-focus" hidden><button id="map-exit-focus" class="button hud-btn">返回全局</button><span id="map-focus-name"></span></div><div class="map-mapkey"><span>北 ↑</span><span id="map-scale"></span><small>现代底图 · 兵牌中心为坐标</small></div><div class="map-zoom"><button id="map-zoom-out" class="button hud-btn">缩小</button><button id="map-fit" class="button hud-btn">适应部署</button><button id="map-zoom-in" class="button hud-btn">放大</button></div></div>
  <footer class="map-footer"><span id="map-status" role="status"></span><span id="map-save-status">部署保存在本浏览器</span></footer>
</section>
<aside class="map-sidebar" aria-label="指挥体系与位置">
  <div class="map-search"><label for="map-search">查找单位或指挥部</label><input id="map-search" type="search" placeholder="番号、连、排、小组…" autocomplete="off"><div id="map-search-results" hidden></div></div>
  <section id="map-inspector"><div class="map-empty"><h2>从指挥机关开始</h2><p>点击兵牌查看编制与位置，双击逐层展开。选择“查看下属部署”可进入基层。</p><p>滚轮缩放，拖动平移。勾选「调整部署」后才能拖动兵牌修改位置。</p></div></section>
  <details class="map-sources"><summary>地图与编制说明</summary><p id="map-scope"></p><div id="map-source-links"></div><p>道路、建筑与地形采用现代地理数据，不代表 1939 年当时的道路或国界。底图需联网加载。</p><p>历史总部与基层示例分别保存。历史资料尚不能支持每个班组的精确位置；示例编制不用于历史人数、装备或部署统计。</p></details>
</aside>
</main>
<div id="map-tooltip" class="map-tooltip" role="tooltip" hidden></div>
<div id="map-context" class="unit-context-menu" hidden><button data-map-action="toggle">展开 / 折叠下级</button><button data-map-action="focus">查看下属部署</button><button data-map-action="lock">锁定 / 解锁展开</button></div>
<div class="sr-only" id="map-announcement" aria-live="polite"></div>
